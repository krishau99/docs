---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docspage-controller
  namespace: docs
  labels:
    app.kubernetes.io/name: docspage-controller
    app.kubernetes.io/managed-by: docspage-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: docspage-controller
  labels:
    app.kubernetes.io/name: docspage-controller
    app.kubernetes.io/managed-by: docspage-controller
rules:
  # DocsPage resources
  - apiGroups: ["zensical.io"]
    resources: ["docspages"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["zensical.io"]
    resources: ["docspages/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["zensical.io"]
    resources: ["docspages/finalizers"]
    verbs: ["update"]

  # Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secrets (read-only, for git credentials and CA certs)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # CRDs (for self-installation on startup)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Events (for recording controller events)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: docspage-controller
  labels:
    app.kubernetes.io/name: docspage-controller
    app.kubernetes.io/managed-by: docspage-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: docspage-controller
subjects:
  - kind: ServiceAccount
    name: docspage-controller
    namespace: docs
