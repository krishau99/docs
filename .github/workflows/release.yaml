name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Derived from the repository rather than hardcoded, so a repository that
  # moves owner keeps publishing to a namespace it actually owns.
  IMAGE_NAME: ${{ github.repository_owner }}/docs-operator

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate release assets
        run: |
          for f in deploy/namespace.yaml deploy/rbac.yaml deploy/deployment.yaml crd/docspage-crd.yaml; do
            [ -f "$f" ] || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Prepare release assets
        run: |
          # Pin the image tag in a versioned copy of the deployment manifest.
          VERSION="${{ github.ref_name }}"
          # GHCR rejects uppercase image names, and an owner may contain them.
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          # Matches whichever owner the checked-in manifest happens to name, so
          # the manifest does not have to be edited when the repository moves.
          sed -E "s|ghcr\\.io/[^/[:space:]]+/docs-operator:latest|${IMAGE}:${VERSION}|g" \
            deploy/deployment.yaml > /tmp/deployment-${VERSION}.yaml
          # Verify the substitution actually replaced something
          grep -q "${IMAGE}:${VERSION}" /tmp/deployment-${VERSION}.yaml || \
            { echo "Image tag substitution failed — check deployment.yaml image reference"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            --title "DocsPage Operator ${VERSION}" \
            "deploy/namespace.yaml#namespace.yaml" \
            "deploy/rbac.yaml#rbac.yaml" \
            "/tmp/deployment-${VERSION}.yaml#deployment.yaml" \
            "crd/docspage-crd.yaml#docspage-crd.yaml"
