# Example DocsPage with mode: prebuilt
# This deploys a pre-existing documentation image without any build steps.
apiVersion: docspage.io/v1alpha1
kind: DocsPage
metadata:
  name: legacy-docs
  namespace: docs
spec:
  mode: prebuilt

  # The pre-built documentation image to deploy. It must already listen on
  # spec.serving.port — the operator does not configure the web server.
  # If the image doesn't already contain a registry host (e.g., "registry.internal/"),
  # the operator will prepend spec.registry.url automatically.
  image: registry.internal/docs-legacy:latest

  # Optional: if set and image doesn't already start with a registry host,
  # this will be prepended to the image reference.
  registry:
    url: registry.internal

  # Custom CA certificate for TLS verification (mounted into the container)
  tls:
    caSecret: custom-ca-cert

  # Serving configuration
  serving:
    replicas: 1
    port: 8080
